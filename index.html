<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    @keyframes spinner {
        0% {
            transform: scale(.1) rotate(0deg);
            fill: currentColor;
        }

        33% {
            transform: scale(1) rotate(150deg);
            fill: transparent;
        }

        66% {
            transform: scale(1) rotate(210deg);
            fill: transparent;
        }

        100% {
            transform: scale(.1) rotate(360deg);
            fill: currentColor;
        }
    }

    .spinner {
        animation: spinner 1.5s infinite linear;
        color: rgb(6, 75, 67);
    }

    .start-button {
        padding: 10px 24px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background-color: rgb(6, 75, 67);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 20px;
        transition: background-color 0.2s ease;

        &:hover {
            background-color: rgb(9, 104, 93);
        }

        &:active {
            background-color: rgb(4, 54, 48);
        }
    }
</style>

<body>
<button id="start" class="start-button">Start!</button>
<div>
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" fill="none" class="spinner"><path stroke="currentColor" stroke-width="4" d="M3.464 30a4 4 0 0 1 0-4L16 4.287a4 4 0 0 1 3.464-2h25.072a4 4 0 0 1 3.464 2L60.536 26a4 4 0 0 1 0 4L48 51.713a4 4 0 0 1-3.464 2H19.464a4 4 0 0 1-3.464-2L3.464 30Z"/></svg>
</div>
<div id="result"></div>
</body>
<script>
    let thread;

    document.getElementById('start').addEventListener('click', () => {
        if (!window.Worker) {
            return;
        }

        // воркер создаётся при первом нажатии, при повторных переиспользуется
        if (!thread) {
            thread = new Worker('./thread.js');
            thread.addEventListener('message', evt => {
                document.getElementById('result').textContent = evt.data;
            });
        }
        thread.postMessage('start');
    });
</script>
</html>
